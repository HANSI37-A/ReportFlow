spring.application.name=weekly-report-backend

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/weekly_report_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT (Override in production via JWT_SECRET environment variable)
app.jwt.secret=${JWT_SECRET:change-this-to-a-long-random-secret-key-for-development-only}
app.jwt.expiration=${JWT_EXPIRATION:86400000}